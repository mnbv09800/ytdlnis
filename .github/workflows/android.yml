name: Android CI

env:
  main_project_module: app

permissions: {}

on:
  push:
    branches:
      - "**"
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Prepare
        run: |
          touch local.properties
          chmod +x gradlew

      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug --warning-mode all

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-foss-debug-arm64
          path: ${{ env.main_project_module }}/build/outputs/apk/foss/debug/*arm64*.apk
